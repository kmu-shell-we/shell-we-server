server:
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:shell_we}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

app:
  jwt:
    key: ${JWT_SECRET_KEY}
    token-expiration-hours: 168
  auth:
    oauth:
      wink:
        base-uri: https://wink.kookmin.ac.kr
        callback-uri: ${WINK_OAUTH_CALLBACK_URI}
        client-id: ${WINK_OAUTH_CLIENT_ID}
        client-secret: ${WINK_OAUTH_CLIENT_SECRET}
      redirect-uri: ${REDIRECT_URI}